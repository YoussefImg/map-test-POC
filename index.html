<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Map draw + search</title>

  <!-- Leaflet -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <!-- Leaflet Draw -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css"
  />

  <!-- Leaflet Geocoder -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css"
  />

  <style>
    html, body {
      height: 100%;
      margin: 0;
    }

    #map {
      height: 100%;
      width: 100%;
    }

    /* 🔍 Force l’affichage de la recherche */
    .leaflet-control-geocoder {
      display: block !important;
      z-index: 1000;
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Leaflet Draw JS -->
  <script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>

  <!-- Leaflet Geocoder JS -->
  <script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>

  <script>
    // 🗺️ Init map (Bruxelles)
    const map = L.map('map').setView([50.8503, 4.3517], 12);

    // Fond de carte
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap'
    }).addTo(map);

    // 🔍 Recherche d’adresse
    const geocoder = L.Control.geocoder({
      position: 'topleft',
      placeholder: 'Rechercher une adresse...',
      errorMessage: 'Adresse introuvable',
      defaultMarkGeocode: true
    })
    .on('markgeocode', function(e) {
      const center = e.geocode.center;
      map.setView(center, 17);
    })
    .addTo(map);

    // ✏️ Zone de dessin
    const drawnItems = new L.FeatureGroup();
    map.addLayer(drawnItems);

    const drawControl = new L.Control.Draw({
      position: 'topleft',
      draw: {
        polygon: true,
        polyline: false,
        rectangle: false,
        circle: false,
        marker: false,
        circlemarker: false
      },
      edit: {
        featureGroup: drawnItems
      }
    });
    map.addControl(drawControl);

    // 📦 Capture du polygone (GeoJSON)
    map.on(L.Draw.Event.CREATED, function (e) {
      drawnItems.clearLayers();
      drawnItems.addLayer(e.layer);

      const geojson = e.layer.toGeoJSON();

      // Envoi vers le parent (Power Apps / Teams / autre)
      window.parent.postMessage(geojson, "*");

      console.log("Zone dessinée (GeoJSON):", geojson);
    });
  </script>
</body>
</html>
